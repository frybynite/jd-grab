<!DOCTYPE html>
<html>
<head><title>Indeed Job - Senior Software Engineer</title></head>
<body>
  <input id="search-input" type="text" />
  <textarea id="message-textarea"></textarea>
  <div contenteditable="true" class="contenteditable-div">Edit me</div>

  <div data-testid="desktop-job-header">
    <h5 data-testid="vj-job-title">Senior Software Engineer</h5>
    <a data-testid="viewjob-apply">Apply now</a>
  </div>

  <div id="jobDetailsSection" data-testid="jobDetailsSection">
    <h4 data-testid="vj-job-description-heading">Full job description</h4>
    <div class="react-native-html-content simple-job-description-html">
      <p>About the Role</p>
      <p>We are looking for a Senior Software Engineer to join our team.</p>
      <ul>
        <li>Responsibilities: Build great software</li>
        <li>Qualifications: 5+ years experience</li>
      </ul>
    </div>
  </div>

  <div data-testid="job-card-container">
    <div data-testid="job-card-container">
      <h2>Explore other jobs</h2>
      <p>Other jobs content that should NOT be selected</p>
    </div>
  </div>
</body>
</html>
